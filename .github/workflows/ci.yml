name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Start local test devices
        run: |
          cd test-devices
          chmod +x tcp_tunnel_device_macos simple_mdns_device_macos run-all.sh
          ./run-all.sh > /tmp/run-all.log 2>&1 &
          sleep 8   # let tcp_tunnel + mdns devices boot and advertise via mDNS

      - name: Build and test
        run: swift test

      - name: Device logs (on failure)
        if: failure()
        run: |
          cat /tmp/run-all.log || true
          tail -n +1 /tmp/tunnel-* || true
